spring.application.name=GestionInventario

# Configure in IntelliJ > Run > Edit Configurations > Environment variables
# Never put a real password in this file or in GitHub.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# For Render: PORT=8080. For Elastic Beanstalk: PORT=5000 / SERVER_PORT=5000.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
